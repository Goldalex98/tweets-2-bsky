name: Release

# On every push to main, semantic-release analyzes conventional commits since the
# previous v* tag. Releasable commits bump package.json + README, create the tag
# and GitHub Release. Tag pushes made with GITHUB_TOKEN do not trigger other
# workflows, so this job dispatches the Docker publishers for multi-arch images.
on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          bun run release
          git fetch --tags --force
          if tag="$(git describe --exact-match --tags HEAD 2>/dev/null)"; then
            echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish Docker images for release tag
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          gh workflow run docker-publish.yml --repo "${GITHUB_REPOSITORY}" --ref "${tag}"
          gh workflow run docker-publish-dockerhub.yml --repo "${GITHUB_REPOSITORY}" --ref "${tag}"
          echo "Dispatched Docker publish workflows for ${tag}"
