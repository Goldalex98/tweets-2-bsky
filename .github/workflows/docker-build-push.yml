name: Docker build and push

# Shared multi-arch publisher used by GHCR and Docker Hub wrappers.
# - Branch pushes: linux/amd64 only (fast).
# - Version tags (v*) and workflow_dispatch: amd64 + arm64 on native runners,
#   then a manifest list merge (no QEMU).

on:
  workflow_call:
    inputs:
      registry:
        description: Registry host (`ghcr.io` or `docker.io`)
        type: string
        required: true
      image_repository:
        description: Image path after the registry (`owner/repo` for GHCR, `tweets-2-bsky` for Docker Hub)
        type: string
        required: true
      username:
        description: Registry username when it is not secret (e.g. github.actor for GHCR)
        type: string
        required: false
        default: ''
      optional_auth:
        description: If true, missing credentials skip publish instead of failing
        type: boolean
        required: false
        default: false
    secrets:
      username:
        required: false
      password:
        required: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      matrix: ${{ steps.plan.outputs.matrix }}
      image: ${{ steps.plan.outputs.image }}
      username: ${{ steps.plan.outputs.username }}
    steps:
      - name: Plan platforms and image name
        id: plan
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          INPUT_USERNAME: ${{ inputs.username }}
          SECRET_USERNAME: ${{ secrets.username }}
          PASSWORD: ${{ secrets.password }}
          OPTIONAL_AUTH: ${{ inputs.optional_auth }}
        run: |
          set -euo pipefail

          username="${SECRET_USERNAME:-$INPUT_USERNAME}"
          if [ "${OPTIONAL_AUTH}" = "true" ] && { [ -z "${username}" ] || [ -z "${PASSWORD}" ]; }; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "matrix=[]" >> "${GITHUB_OUTPUT}"
            echo "image=" >> "${GITHUB_OUTPUT}"
            echo "username=" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping Docker publish because registry credentials are not set."
            exit 0
          fi

          if [ -z "${username}" ] || [ -z "${PASSWORD}" ]; then
            echo "::error::Registry username/password are required to publish."
            exit 1
          fi

          repo="$(echo "${IMAGE_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [ "${REGISTRY}" = "docker.io" ]; then
            image="docker.io/${username}/${repo}"
          else
            image="${REGISTRY}/${repo}"
          fi
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "username=${username}" >> "${GITHUB_OUTPUT}"
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

          if [[ "${GITHUB_REF}" == refs/tags/v* || "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            echo 'matrix=[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]' >> "${GITHUB_OUTPUT}"
            echo "::notice::Publishing multi-arch image (amd64 + arm64 on native runners)."
          else
            echo 'matrix=[{"platform":"linux/amd64","runner":"ubuntu-latest"}]' >> "${GITHUB_OUTPUT}"
            echo "::notice::Publishing amd64-only image for branch push. Use a v* tag or workflow_dispatch for amd64+arm64."
          fi

  build:
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ needs.plan.outputs.username }}
          password: ${{ secrets.password }}

      - name: Log in to Docker Hub
        if: inputs.registry == 'docker.io'
        uses: docker/login-action@v3
        with:
          username: ${{ needs.plan.outputs.username }}
          password: ${{ secrets.password }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.plan.outputs.image }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.platform }}
          outputs: type=image,name=${{ needs.plan.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - plan
      - build
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ needs.plan.outputs.username }}
          password: ${{ secrets.password }}

      - name: Log in to Docker Hub
        if: inputs.registry == 'docker.io'
        uses: docker/login-action@v3
        with:
          username: ${{ needs.plan.outputs.username }}
          password: ${{ secrets.password }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.plan.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ needs.plan.outputs.image }}:${{ steps.meta.outputs.version }}"
