name: Quality

# Release and Docker publishers call this gate before creating public artifacts.
# Keep this workflow independent of its callers to avoid dependency cycles.
on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Set up Node for release tooling and browser tests
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Advisories against the resolved tree, not the declared ranges: stale
      # lockfile pins are how this project accumulated 68 advisories unnoticed.
      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Verify scraper compatibility
        run: bun run verify:deps

      - name: Rehearse release tooling under the pinned Node runtime
        run: node scripts/release-toolchain-preflight.mjs

      - name: Check lint
        run: bun run lint:check

      - name: Typecheck server
        run: bun run typecheck:server

      - name: Typecheck web
        run: bun run typecheck:web

      - name: Run unit tests
        run: bun run test:unit

      - name: Run integration tests
        run: bun run test:integration

      - name: Run copied-volume release tests
        run: bun run test:release

      - name: Build
        run: bun run build

      - name: Install Playwright Chromium
        run: bun run playwright:install --with-deps

      - name: Run mocked dashboard E2E
        run: bun run test:e2e

      - name: Upload failed E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 5
