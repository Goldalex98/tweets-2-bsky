# Local / simple Docker deploy for this fork.
# Image: ghcr.io/goldalex98/tweets-2-bsky (published from this repository).
# Production refuses to start without CONFIG_ENCRYPTION_KEY when NODE_ENV=production.
# Generate: openssl rand -hex 32
services:
  tweets-2-bsky:
    image: ghcr.io/goldalex98/tweets-2-bsky:latest
    container_name: tweets-2-bsky
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TWEETS2BSKY_DATA_DIR: /app/data
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?Set CONFIG_ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      JWT_SECRET: ${JWT_SECRET:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ENABLE_PROMETHEUS_METRICS: ${ENABLE_PROMETHEUS_METRICS:-false}
      INGESTION_RATE_LIMIT_PER_MINUTE: ${INGESTION_RATE_LIMIT_PER_MINUTE:-120}
    volumes:
      - tweets2bsky_data:/app/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  tweets2bsky_data:
    name: tweets2bsky_data
