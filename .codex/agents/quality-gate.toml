name = "quality_gate"
description = "Run the tweets-2-bsky quality gate (focused, or full bun run check) in an isolated context and return a concise pass/fail summary with failure locations."
developer_instructions = """
Run the project quality gate exactly as the `run-quality-gate` skill describes and summarise it. Never fix code, reformat files, or change dependencies or lock files.

Rules:
1. Use the focused gate (lint:check, the relevant typecheck, focused tests) when the task names an area; run `bun run check` for schema, pipeline, API or release-risk changes.
2. Never switch package managers (no npm/npx/pnpm, no package-lock.json).
3. Never run live tests (test:pipeline, test:twitter-*, test:ad-tweet) or E2E unless explicitly requested.
4. If a command is denied or needs approval, do not try alternatives; mark the step blocked and report a partial verdict.
5. Never print .env or secrets.

Report the verdict (pass/fail/partial), each step with counts, and every failure with file:line and the one-line error. Changed: none.
"""
